name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # ── Frontend ──────────────────────────────────────────
      - name: Install frontend dependencies
        run: npm i

      - name: Build frontend
        run: npm run build
        env:
          NEXT_PUBLIC_RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}

      # ── Firebase Functions ────────────────────────────────
      - name: Install functions dependencies
        run: npm i
        working-directory: functions

      - name: Build functions
        run: npm run build
        working-directory: functions

      - name: Create functions env
        run: |
          cat > functions/.env << 'EOF'
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SES_REGION=${{ secrets.AWS_SES_REGION }}
          SES_FROM_EMAIL=${{ secrets.SES_FROM_EMAIL }}
          SES_TO_EMAIL=${{ secrets.SES_TO_EMAIL }}
          RECAPTCHA_SECRET_KEY=${{ secrets.RECAPTCHA_SECRET_KEY }}
          EOF

      # ── Deploy ────────────────────────────────────────────
      - name: Set up Firebase credentials
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > /tmp/firebase-sa.json

      - name: Deploy hosting + functions
        run: npx firebase-tools deploy --only hosting,functions --project phisit-ks
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
